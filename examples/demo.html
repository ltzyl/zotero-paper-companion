<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>虚构示例：引用关系图</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#20304a;font:14px system-ui}header{padding:20px 28px;background:white;border-bottom:1px solid #dce2eb}h1{font-size:22px;margin:0 0 8px}p{margin:6px 0;color:#60718a}input,select,button{padding:8px 12px;border:1px solid #ccd5e2;border-radius:6px;background:white;margin:8px 8px 0 0}main{display:grid;grid-template-columns:1fr 330px;height:calc(100vh - 160px)}svg{width:100%;height:100%;touch-action:none}aside{padding:20px;overflow:auto;background:white;border-left:1px solid #dce2eb}a{color:#245ba7}li{margin:12px 0;line-height:1.5}circle{cursor:grab}text{pointer-events:none;font-size:11px;fill:#20304a}path.edge{stroke:#8b9cb5;stroke-width:1.5;fill:none;opacity:.55}#detail{white-space:pre-wrap;line-height:1.6}small{color:#74849b}</style>
<header><h1>虚构示例：引用关系图</h1><p>箭头：引用这篇文章的论文 → 被引用论文。拖动节点调整位置；滚轮缩放；点击节点查看证据和打开 Zotero 条目。</p><input id="query" placeholder="搜索标题或 DOI"><select id="scope"><option value="focus">选定分类及相关文献</option value="all">整个个人文库</option value="linked">只看有引用关系的文献</option></select><button id="reset">重新布局</button><button onclick="location.reload()">加载最新结果</button><small id="stats"></small></header>
<main><svg id="chart" viewBox="0 0 1200 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8da8"/></marker></defs><g id="scene"></g></svg><aside><h3>引用证据</h3><div id="detail">选择一个节点。图中未连线不代表论文没有引用；扫描版、参考文献格式或文库缺少被引条目都可能导致未匹配。</div><ul id="links"></ul></aside></main>
<script>
const data={"nodes": [{"key": "DEMO0001", "title": "Imaginary Study A: Rain Gardens in a Toy City", "titleZh": "虚构研究 A：玩具城市中的雨水花园", "doi": "", "collections": ["虚构分类：城市研究"], "focus": true}, {"key": "DEMO0002", "title": "Imaginary Study B: A Synthetic Water Balance Model", "titleZh": "虚构研究 B：合成水量平衡模型", "doi": "", "collections": ["虚构分类：模型方法"], "focus": true}, {"key": "DEMO0003", "title": "Imaginary Study C: Testing an Invented Neighborhood", "titleZh": "虚构研究 C：虚拟街区测试", "doi": "", "collections": ["虚构分类：城市研究"], "focus": true}], "edges": [{"source": "DEMO0001", "target": "DEMO0002", "evidence": "演示连线：人为构造，不是真实引用"}, {"source": "DEMO0003", "target": "DEMO0001", "evidence": "演示连线：人为构造，不是真实引用"}], "updated": "虚构演示，无真实文献", "coverage": {"DEMO0001": "parsed", "DEMO0002": "parsed", "DEMO0003": "parsed"}};
const ns='http://www.w3.org/2000/svg',svg=document.querySelector('#chart'),scene=document.querySelector('#scene'),query=document.querySelector('#query'),scope=document.querySelector('#scope');let positions={},visible=[],edges=[],zoom=1,drag;
function el(name,attrs){const e=document.createElementNS(ns,name);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;}
function draw(){const q=query.value.toLowerCase(),linked=new Set(data.edges.flatMap(e=>[e.source,e.target])),focus=new Set(data.nodes.filter(n=>n.focus).map(n=>n.key));for(const e of data.edges)if(data.nodes.some(n=>n.focus&&(n.key===e.source||n.key===e.target))){focus.add(e.source);focus.add(e.target);}
visible=data.nodes.filter(n=>(scope.value==='all'||(scope.value==='linked'?linked:focus).has(n.key))&&(!q||(n.title+' '+(n.titleZh||'')+' '+n.doi).toLowerCase().includes(q)));const keys=new Set(visible.map(n=>n.key));edges=data.edges.filter(e=>keys.has(e.source)&&keys.has(e.target));
const columns=Math.max(3,Math.ceil(Math.sqrt(visible.length*1.5))),rows=Math.ceil(visible.length/columns);visible.forEach((n,i)=>{positions[n.key]||={x:90+(i%columns)*1020/Math.max(1,columns-1),y:70+Math.floor(i/columns)*760/Math.max(1,rows-1)};});render();document.querySelector('#stats').textContent=`${visible.length} 个条目 · ${edges.length} 条有方向引用 · 更新于 ${data.updated}`;}
function render(){scene.replaceChildren();for(const e of edges){const a=positions[e.source],b=positions[e.target],dx=b.x-a.x,dy=b.y-a.y,l=Math.max(1,Math.hypot(dx,dy));scene.append(el('path',{class:'edge',d:`M${a.x+dx/l*13},${a.y+dy/l*13} Q${(a.x+b.x)/2-dy*.08},${(a.y+b.y)/2+dx*.08} ${b.x-dx/l*17},${b.y-dy/l*17}`,'marker-end':'url(#arrow)'}));}
for(const n of visible){const p=positions[n.key],g=el('g',{}),c=el('circle',{cx:p.x,cy:p.y,r:12,fill:n.focus?'#347b88':'#6e86b8',stroke:'white','stroke-width':3});const t=el('text',{x:p.x,y:p.y+28,'text-anchor':'middle'});const label=n.titleZh||n.title;const size=n.titleZh?14:24;for(let line=0;line<2;line++){const span=el('tspan',{x:p.x,dy:line?15:0});span.textContent=label.slice(line*size,(line+1)*size)+(line===1&&label.length>2*size?'…':'');t.append(span);}const title=el('title',{});title.textContent=n.title;c.append(title);c.addEventListener('pointerdown',e=>{drag=n.key;svg.setPointerCapture(e.pointerId);show(n);});g.append(c,t);scene.append(g);}}
function show(n){document.querySelector('#detail').textContent=n.title+'\n'+(n.doi||'无 DOI')+'\n分类：'+n.collections.join('、')+'\n识别状态：'+({parsed:'已提取参考文献','no-original-pdf':'没有可读取的原文','no-reference-heading':'未识别参考文献标题','extraction-failed':'读取失败'}[data.coverage[n.key]]||'待检查');const ul=document.querySelector('#links');ul.replaceChildren();const top=document.createElement('li'),a=document.createElement('a');a.textContent='在 Zotero 中打开此条目';a.href='#';a.onclick=event=>event.preventDefault();top.append(a);ul.append(top);for(const e of data.edges.filter(e=>e.source===n.key||e.target===n.key)){const other=data.nodes.find(x=>x.key===(e.source===n.key?e.target:e.source)),li=document.createElement('li'),a=document.createElement('a');a.textContent=(e.source===n.key?'引用 → ':'← 被引用于 ')+other.title;a.href='#';a.onclick=event=>{event.preventDefault();show(other)};li.append(a,document.createElement('br'),document.createTextNode(e.evidence));ul.append(li);}}
svg.addEventListener('pointermove',e=>{if(!drag)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(scene.getScreenCTM().inverse());positions[drag]={x:p.x,y:p.y};render();});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);svg.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(3,Math.max(.35,zoom*(e.deltaY>0?.9:1.1)));scene.setAttribute('transform',`translate(${600*(1-zoom)} ${450*(1-zoom)}) scale(${zoom})`);},{passive:false});query.addEventListener('input',draw);scope.addEventListener('change',draw);document.querySelector('#reset').onclick=()=>{positions={};zoom=1;scene.removeAttribute('transform');draw();};draw();
</script></html>
